# Builds the Android TV APK in CI and publishes it as a downloadable
# artifact.
#
# This exists because the APK needs a JDK and the Android SDK to build, and
# GitHub's runners already have both — so you can get an installable APK
# without setting up an Android toolchain locally.
#
# Gradle is invoked directly rather than through ./gradlew: the wrapper JAR is
# a binary and isn't committed to this repo. `gradle wrapper` regenerates it
# locally if you want the wrapper.
#
# The output is debug-signed, which is all a sideloaded app needs. It cannot be
# published to Play without a real signing key.

name: Android TV APK

on:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-tv
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kdrive-tv-debug-apk
          path: android-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
