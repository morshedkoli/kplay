# Kernel network tuning for serving video over a long path.
#
# Install:
#   sudo cp deploy/sysctl/99-kdrive-network.conf /etc/sysctl.d/
#   sudo sysctl --system
#
# Why this file exists
# --------------------
# A TCP connection cannot send more than one window of data per round trip, so
# its ceiling is (window / RTT) no matter how fast either end's link is. The
# viewer of this server is ~256 ms away from it; at that distance the stock
# 208 KB send buffer caps a single connection at roughly 6 Mbps, and in
# practice it measured 2.6 Mbps — about a quarter of what a 1080p WEB-DL file
# needs, which is precisely what the stuttering was.
#
# On a serverless platform this never showed up: the app was served from an
# edge a few milliseconds away, where a small window is ample. One fixed VPS
# has no edge, so the window has to be big enough for the real distance.
#
# None of this helps a nearby client and none of it costs anything there — the
# buffers below are ceilings for autotuning, not fixed allocations.

# Buffer ceilings. 64 MB is far above what one stream needs; the kernel grows
# towards it only when the path's delay-bandwidth product justifies it. At
# 256 ms, sustaining 100 Mbps needs about 3.2 MB in flight, so the old 208 KB
# ceiling was the binding constraint and this is not.
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864

# min / default / max for TCP autotuning specifically. The max here is what
# actually lifts the per-connection ceiling; the default is left modest so an
# idle connection does not reserve memory it will not use.
net.ipv4.tcp_rmem = 4096 131072 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864

# BBR estimates the path's actual bandwidth and delay instead of treating
# every lost packet as congestion. On a long path with even slight loss —
# which describes any intercontinental route — loss-based congestion control
# (the CUBIC default) spends most of its time backed off, and this is usually
# the single largest win available. Requires the fq queueing discipline.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Remembering the previous connection's congestion state punishes a new
# stream for an unrelated earlier stall. Each playback should start by probing
# the path as it is now.
net.ipv4.tcp_no_metrics_save = 1

# Let the window scale up early rather than ramping over the first several
# seconds of playback — which is exactly the period a viewer is staring at a
# spinner.
net.ipv4.tcp_slow_start_after_idle = 0

# The listen backlog and connection queue, raised because a player opens a new
# range request on every seek and a burst of them should never be dropped.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
