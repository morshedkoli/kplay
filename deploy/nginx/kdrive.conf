# nginx site config for kPlay.
#
# Install on the VPS:
#   sudo cp deploy/nginx/kdrive.conf /etc/nginx/sites-available/kdrive
#   sudo ln -s /etc/nginx/sites-available/kdrive /etc/nginx/sites-enabled/kdrive
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS:
#   sudo certbot --nginx -d murshedkoli.me
# certbot rewrites the listen directives and adds the certificate lines.
#

upstream kdrive_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name murshedkoli.me;

    # Uploads are whole movie files. Without this nginx rejects anything over
    # 1 MB with a 413 before the request ever reaches the app.
    client_max_body_size 0;

    # Don't spool the upload body to disk first — the app streams the request
    # straight to Google Drive, and buffering a multi-GB file would fill the
    # VPS disk and add the full upload time twice.
    proxy_request_buffering off;

    # Same reasoning for responses: video must reach the player as it arrives,
    # not after nginx has collected it.
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        '';

    # Range requests must pass through untouched for seeking to work.
    proxy_set_header Range             $http_range;
    proxy_set_header If-Range          $http_if_range;

    # Immutable build assets — hashed filenames, safe to cache hard.
    location /_next/static/ {
        proxy_pass http://kdrive_app;
        proxy_cache_valid 200 1y;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    # A large upload or a long sequential read must not be cut off mid-flight.
    # 24h covers the slowest plausible home-upstream upload of a big file.
    location /api/media/upload {
        proxy_pass http://kdrive_app;
        proxy_request_buffering off;
        proxy_read_timeout    24h;
        proxy_send_timeout    24h;
        proxy_connect_timeout 60s;
    }

    location /api/media/stream/ {
        proxy_pass http://kdrive_app;

        # Buffering ON here, against the server-wide setting above.
        #
        # With it off, nginx writes each chunk straight through and only reads
        # from the app as fast as the television drains — so a player with a
        # full buffer stalls the whole chain back to Drive, and every hiccup
        # upstream is a hiccup on screen. With it on, nginx keeps pulling into
        # 8 MB of memory while the player is idle and has bytes ready the
        # moment it asks. This is a file download, not a live stream: there is
        # no latency to protect, only throughput.
        proxy_buffering on;
        proxy_buffers 128 64k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 512k;

        # Never spool to disk. A film is far larger than any sane temp file,
        # and writing one would turn a bandwidth problem into a disk-IO
        # problem. At zero, nginx simply stops reading when its buffers fill —
        # exactly the backpressure wanted.
        proxy_max_temp_file_size 0;

        proxy_read_timeout    24h;
        proxy_send_timeout    24h;
        proxy_connect_timeout 60s;
    }

    location / {
        proxy_pass http://kdrive_app;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        gzip on;
        gzip_proxied any;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }
}
